# rtabmap.yaml
# ─────────────
# RTAB-Map visual localisation — runs in localization-only mode.
# No new map nodes are added; reads the visual database built during mapping.
#
# publish_tf: false — AMCL owns the map→odom TF.  RTAB-Map only publishes
# /rtabmap/localization_pose which hybrid_localiser fuses with AMCL.
#
# Requires a database at database_path (built with use_rtabmap_mapping:=true
# during the mapping session, or via stand-alone rtabmap SLAM).
#
# Usage in navigation launch: use_rtabmap:=true

rtabmap:
  ros__parameters:
    frame_id: base_footprint
    odom_frame_id: odom
    publish_tf: false
    subscribe_depth: true
    subscribe_rgb: true
    subscribe_scan: false

    # RGB-D topics (RealSense D-series naming)
    rgb/image: /camera/color/image_raw
    rgb/camera_info: /camera/color/camera_info
    depth/image: /camera/depth/image_raw

    # Localization only — do not grow the map
    Mem/IncrementalMemory: "false"
    Mem/InitWMWithAllNodes: "true"

    database_path: "/home/mirte/rtabmap.db"

    # Matching strategy: visual (PnP)
    Reg/Strategy: "0"
    Vis/EstimationType: "1"

    queue_size: 10
    wait_for_transform: 0.2
    approx_sync: true

# ── Mapping variant (use_rtabmap_mapping:=true during mapping.launch.py) ─────
# Override Mem/IncrementalMemory → "true" and Mem/InitWMWithAllNodes → "false"
# at launch time via extra parameters=[{"Mem/IncrementalMemory": "true", ...}]
